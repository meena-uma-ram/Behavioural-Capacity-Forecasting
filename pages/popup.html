<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Capacity forecast</title>
  <style>
    body { margin: 0; padding: 14px; width: 260px; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #172b4d; background: #fff; }
    @media (prefers-color-scheme: dark) { body { color: #dee4ea; background: #22272b; } }
    h1 { font-size: 14px; margin: 0 0 6px; }
    p { margin: 0 0 10px; }
    button { display: block; width: 100%; margin-top: 6px; padding: 7px; border: 0; border-radius: 4px; background: #0c66e4; color: #fff; font: inherit; cursor: pointer; }
    button.secondary { background: transparent; color: inherit; border: 1px solid #8590a2; }
  </style>
</head>
<body>
  <h1>Capacity forecast</h1>
  <p>Open a Jira board or backlog and click <strong>Capacity forecast</strong> in the bottom-right corner.</p>
  <button id="demo">Try the demo</button>
  <button id="options" class="secondary">Settings</button>
  <script src="popup.js"></script>
</body>
</html>
