<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capacity Forecast Settings</title>
  <style>
    :root { --fg: #172b4d; --muted: #626f86; --bg: #fff; --border: #dcdfe4; }
    @media (prefers-color-scheme: dark) { :root { --fg: #dee4ea; --muted: #9fadbc; --bg: #22272b; --border: #3b444c; } }
    body { margin: 0; padding: 24px 16px; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--fg); background: var(--bg); }
    main { max-width: 520px; margin: 0 auto; }
    label { display: grid; grid-template-columns: 1fr 90px; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
    small { display: block; color: var(--muted); }
    input { padding: 4px 6px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--fg); font: inherit; }
    button { margin-top: 16px; padding: 8px 16px; border: 0; border-radius: 4px; background: #0c66e4; color: #fff; font: inherit; cursor: pointer; }
    #status { margin-left: 8px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Capacity forecast settings</h1>
    <p><small>Describe a typical sprint for your team. Forecasts compare next sprint against this baseline.</small></p>
    <form id="form">
      <label>Working days per sprint <input name="sprintDays" type="number" min="1" max="30"></label>
      <label>Working hours per day <input name="hoursPerDay" type="number" min="1" max="12"></label>
      <label><span>Typical meeting hours per week <small>per person</small></span> <input name="typicalMeetingHoursPerWeek" type="number" min="0" max="40"></label>
      <label><span>Typical projects per person <small>how many projects people usually work on at once</small></span> <input name="typicalProjects" type="number" min="1" max="5"></label>
      <label><span>Sprints of history to use <small>more is steadier, fewer reacts faster to change</small></span> <input name="historyCount" type="number" min="3" max="20"></label>
      <button type="submit">Save</button><span id="status" role="status"></span>
    </form>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
