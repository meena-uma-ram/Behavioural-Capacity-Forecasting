name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: dist/extension.zip
      - name: Publish release
        # A new version in manifest.json on main (or a pushed v* tag) publishes a release once.
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(node -p "require('./manifest.json').version")"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists"
          else
            gh release create "$version" dist/extension.zip --target "$GITHUB_SHA" --title "$version" --generate-notes
          fi
